<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Globe Orbit Ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#globeGrad)" stroke-width="3"/>
  
  <!-- Latitude and Meridians -->
  <ellipse cx="32" cy="32" rx="8" ry="17" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
  <line x1="15" y1="32" x2="49" y2="32" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
  
  <!-- Live Breaking News Beacon -->
  <circle cx="43" cy="21" r="4.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="43" cy="21" r="2" fill="#ffffff"/>
</svg>
